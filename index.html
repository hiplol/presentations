<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentations</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#0b0f0a;--bg2:#121712;--line:#1f2a1f;--accent:#a6ff3a;--text:#f2f7ec;--muted:#8ca38a}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;
  background:var(--bg2);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50}
.topbar h1{font-size:18px;margin:0;flex:1;font-weight:600;text-align:center}
.back{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
main{padding:24px;max-width:1200px;margin:0 auto}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{display:flex;flex-direction:column;min-height:140px;background:var(--bg2);
  border:1px solid var(--line);border-radius:12px;padding:18px;color:var(--text);
  transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-title{font-weight:600;font-size:16px}
.card-lock{color:var(--accent)}
.card-desc{color:var(--muted);font-size:14px;margin:8px 0;flex:1}
.card-foot{color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.error{color:#ff6b6b;min-height:1.2em}
.btn{background:var(--accent);color:#0b0f0a;border:0;padding:9px 16px;
  border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:#b9ff66}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.hidden{display:none!important}
.lock-screen{max-width:380px;margin:80px auto;text-align:center;
  background:var(--bg2);border:1px solid var(--line);padding:32px;border-radius:12px}
.lock-screen input{width:100%;padding:10px;margin:12px 0;background:var(--bg);
  border:1px solid var(--line);color:var(--text);border-radius:8px}
.viewer-page{user-select:none;-webkit-user-select:none}
.pages{display:flex;flex-direction:column;gap:20px;align-items:center;padding-bottom:80px}
.pdf-page{box-shadow:0 4px 24px rgba(0,0,0,.4);background:#fff;
  pointer-events:none;user-select:none}
.watermark-layer{position:fixed;inset:0;pointer-events:none;
  background-repeat:repeat;z-index:30;opacity:.9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;
  align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-inner{background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:24px;max-width:480px;width:100%}
.modal-inner h2{margin-top:0}
.modal-inner input,.modal-inner textarea{width:100%;padding:10px;margin:6px 0;
  background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:8px;font-family:inherit}
.modal-inner textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
@media print{body *{display:none!important}
  body::before{content:"Printing is disabled";display:block!important;color:#000;
    padding:40px;font-size:24px}}
</style>
</head>
<body>
<header class="topbar">
  <button id="back-btn" class="back hidden">← Back</button>
  <h1 id="page-title">Presentations</h1>
  <button id="request-btn" class="btn ghost hidden">Request copy</button>
</header>

<main>
  <section id="grid-view">
    <div id="grid" class="grid"></div>
  </section>

  <section id="viewer-view" class="hidden viewer-page">
    <div id="lock-screen" class="lock-screen hidden">
      <h2>🔒 Locked</h2>
      <p>Enter password:</p>
      <input id="pw-input" type="password" autocomplete="off">
      <button id="pw-submit" class="btn">Open</button>
      <p id="pw-error" class="error"></p>
    </div>
    <div id="pages" class="pages"></div>
  </section>
</main>

<div id="watermark-layer" class="watermark-layer hidden"></div>

<div id="modal" class="modal hidden">
  <div class="modal-inner">
    <h2>Copy request</h2>
    <p class="muted">Leave your contact — I'll get back to you after approval.</p>
    <input id="req-contact" placeholder="Email or Telegram">
    <textarea id="req-reason" placeholder="Reason (optional)"></textarea>
    <div class="modal-actions">
      <button id="req-cancel" class="btn ghost">Cancel</button>
      <button id="req-send" class="btn">Send</button>
    </div>
    <p id="req-status" class="muted"></p>
  </div>
</div>

<div id="modal-voucher" class="modal hidden">
  <div class="modal-inner">
    <h2>Redeem voucher</h2>
    <p class="muted">Enter the code you were given.</p>
    <input id="voucher-input" placeholder="XXXX-XXXX-XXXX">
    <div class="modal-actions">
      <button id="voucher-cancel" class="btn ghost">Cancel</button>
      <button id="voucher-go" class="btn">Download .pptx</button>
    </div>
    <p id="voucher-status" class="muted"></p>
  </div>
</div>

<script>
// ================= CONFIG =================
const CONFIG = {
  siteTitle: "My presentations",
  formspreeEndpoint: "",       // optional: https://formspree.io/f/xxxxxxx
  contactEmail: "you@example.com",
};
document.title = CONFIG.siteTitle;
document.getElementById('page-title').textContent = CONFIG.siteTitle;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ================= CRYPTO =================
const Crypto = (() => {
  const enc = new TextEncoder();
  const ITER = 200000;
  async function deriveKey(password, salt) {
    const km = await crypto.subtle.importKey(
      'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
  }
  async function decrypt(ctBuf, password, salt, iv) {
    const key = await deriveKey(password, salt);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ctBuf);
  }
  function b64ToBuf(b64) {
    const bin = atob(b64); const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf;
  }
  async function sha256Hex(str) {
    const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  return { decrypt, b64ToBuf, sha256Hex };
})();

// ================= STATE =================
let DB = { presentations: [], vouchers: [] };
let CURRENT = null;

async function loadData() {
  try {
    const r = await fetch('data.json', { cache: 'no-store' });
    DB = await r.json();
    if (!DB.presentations) DB.presentations = [];
    if (!DB.vouchers) DB.vouchers = [];
  } catch (e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ================= ROUTER =================
window.addEventListener('hashchange', route);
route();

async function route() {
  const m = location.hash.match(/^#v\/(.+)$/);
  if (m) await showViewer(decodeURIComponent(m[1]));
  else await showGrid();
}

// ================= GRID =================
async function showGrid() {
  document.getElementById('grid-view').classList.remove('hidden');
  document.getElementById('viewer-view').classList.add('hidden');
  document.getElementById('watermark-layer').classList.add('hidden');
  document.getElementById('back-btn').classList.add('hidden');
  document.getElementById('request-btn').classList.add('hidden');
  document.getElementById('page-title').textContent = CONFIG.siteTitle;
  document.title = CONFIG.siteTitle;
  CURRENT = null;

  await loadData();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!DB.presentations.length) {
    grid.innerHTML = '<p class="muted">No presentations yet.</p>';
    return;
  }
  for (const p of DB.presentations) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '#v/' + encodeURIComponent(p.id);
    a.innerHTML = `
      <div class="card-head">
        <span class="card-title">${escapeHtml(p.title)}</span>
        <span class="card-lock">${p.locked ? '🔒' : ''}</span>
      </div>
      <p class="card-desc">${escapeHtml(p.description || '')}</p>
      <div class="card-foot">${escapeHtml(p.created || '')}</div>`;
    grid.appendChild(a);
  }
}

// ================= VIEWER =================
async function showViewer(pid) {
  document.getElementById('grid-view').classList.add('hidden');
  document.getElementById('viewer-view').classList.remove('hidden');
  document.getElementById('back-btn').classList.remove('hidden');
  document.getElementById('request-btn').classList.remove('hidden');
  document.getElementById('pages').innerHTML = '';
  document.getElementById('lock-screen').classList.add('hidden');
  document.getElementById('pw-error').textContent = '';

  await loadData();
  CURRENT = DB.presentations.find(p => p.id === pid);
  if (!CURRENT) {
    document.getElementById('page-title').textContent = 'Not found';
    return;
  }
  document.getElementById('page-title').textContent = CURRENT.title;
  document.title = CURRENT.title;

  await buildWatermark();
  document.getElementById('watermark-layer').classList.remove('hidden');

  if (CURRENT.locked) {
    document.getElementById('lock-screen').classList.remove('hidden');
  } else {
    try { await renderPdf(null); }
    catch (e) { console.error(e); }
  }
}

async function buildWatermark() {
  let ip = 'IP ?';
  try {
    const r = await fetch('https://api.ipify.org?format=json', { cache: 'no-store' });
    ip = (await r.json()).ip;
  } catch (e) {}
  const fp = await Crypto.sha256Hex(
    navigator.userAgent + '|' + screen.width + 'x' + screen.height +
    '|' + Intl.DateTimeFormat().resolvedOptions().timeZone
  );
  const now = new Date().toLocaleString('en-US');
  const text = `${ip}  ·  ${fp.slice(0, 8)}  ·  ${now}`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260"><text x="50%" y="50%" font-family="sans-serif" font-size="18" fill="rgba(120,120,120,0.16)" text-anchor="middle" transform="rotate(-30 260 130)">${text}</text></svg>`;
  document.getElementById('watermark-layer').style.backgroundImage =
    `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
}

async function renderPdf(password) {
  let pdfBytes;
  const r = await fetch(CURRENT.pdf.file, { cache: 'no-store' });
  if (!r.ok) throw new Error('fetch failed');

  if (CURRENT.pdf.encrypted) {
    const ctBuf = await r.arrayBuffer();
    const salt = Crypto.b64ToBuf(CURRENT.pdf.salt);
    const iv = Crypto.b64ToBuf(CURRENT.pdf.iv);
    pdfBytes = await Crypto.decrypt(ctBuf, password, salt, iv);
  } else {
    pdfBytes = await r.arrayBuffer();
  }

  document.getElementById('lock-screen').classList.add('hidden');
  const pagesEl = document.getElementById('pages');
  pagesEl.innerHTML = '';

  const pdf = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
  const scale = Math.min(2, window.devicePixelRatio || 1);
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale: 1.3 * scale });
    const c = document.createElement('canvas');
    c.className = 'pdf-page';
    c.width = vp.width; c.height = vp.height;
    c.style.width = (vp.width / scale) + 'px';
    pagesEl.appendChild(c);
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  }
}

// ================= PROTECTION =================
['contextmenu','copy','cut','paste','dragstart','selectstart'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['s','p','c','a'].includes(k)) e.preventDefault();
});
window.addEventListener('beforeprint', () => {
  document.getElementById('pages').style.display = 'none';
});
window.addEventListener('afterprint', () => {
  document.getElementById('pages').style.display = '';
});

// ================= PASSWORD =================
document.getElementById('pw-submit').addEventListener('click', tryUnlock);
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryUnlock();
});
async function tryUnlock() {
  const pw = document.getElementById('pw-input').value;
  const err = document.getElementById('pw-error');
  err.textContent = '';
  try {
    await renderPdf(pw);
  } catch (e) {
    err.textContent = 'Incorrect password';
  }
}

// ================= REQUEST =================
const modal = document.getElementById('modal');
document.getElementById('request-btn').onclick = () => modal.classList.remove('hidden');
document.getElementById('req-cancel').onclick = () => modal.classList.add('hidden');

document.getElementById('req-send').onclick = async () => {
  const contact = document.getElementById('req-contact').value.trim();
  const reason = document.getElementById('req-reason').value.trim();
  const status = document.getElementById('req-status');
  if (!contact) { status.textContent = 'Please provide a contact'; return; }
  status.textContent = 'Sending…';

  const payload = {
    presentation_id: CURRENT.id,
    presentation_title: CURRENT.title,
    contact, reason, page: location.href,
  };

  try {
    if (CONFIG.formspreeEndpoint) {
      await fetch(CONFIG.formspreeEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload),
      });
      status.textContent = 'Sent. Awaiting reply.';
    } else {
      const subj = encodeURIComponent(`Copy request: ${CURRENT.title}`);
      const body = encodeURIComponent(
        `Presentation: ${CURRENT.title}\nID: ${CURRENT.id}\nContact: ${contact}\nReason: ${reason}`
      );
      location.href = `mailto:${CONFIG.contactEmail}?subject=${subj}&body=${body}`;
      status.textContent = 'Mail client opened.';
    }
    setTimeout(() => vModal.classList.remove('hidden'), 500);
  } catch (e) {
    status.textContent = 'Send failed';
  }
};

// ================= VOUCHER =================
const vModal = document.getElementById('modal-voucher');
document.getElementById('voucher-cancel').onclick = () => vModal.classList.add('hidden');

document.getElementById('voucher-go').onclick = async () => {
  const code = document.getElementById('voucher-input').value.trim();
  const status = document.getElementById('voucher-status');
  status.textContent = 'Checking…';

  try {
    for (const v of DB.vouchers) {
      if (v.presentation_id !== CURRENT.id) continue;
      try {
        // 1. Derive KEK from voucher code
        const vSalt = Crypto.b64ToBuf(v.salt);
        const vIv   = Crypto.b64ToBuf(v.iv);
        const encKek = Crypto.b64ToBuf(v.encrypted_key);
        const kekBuf = await Crypto.decrypt(encKek, code, vSalt, vIv);

        // 2. Import KEK
        const kekKey = await crypto.subtle.importKey(
          'raw', kekBuf, { name: 'AES-GCM' }, false, ['decrypt']
        );

        // 3. Decrypt source.pptx
        const sRes = await fetch(CURRENT.source.file, { cache: 'no-store' });
        const sCt = await sRes.arrayBuffer();
        const sIv = Crypto.b64ToBuf(CURRENT.source.iv);
        const pptxBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: sIv }, kekKey, sCt
        );

        // 4. Download
        const blob = new Blob([pptxBuf], {
          type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = CURRENT.title + '.pptx';
        a.click();
        URL.revokeObjectURL(url);
        status.textContent = 'File downloaded.';
        return;
      } catch (e) { /* not this voucher — try next */ }
    }
    status.textContent = 'Voucher does not match.';
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
};
</script>
</body>
</html>
